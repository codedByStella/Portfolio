name: Front-end separation checks

on:
  push:
  pull_request:

jobs:
  css-separation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Enforce HTML/CSS separation
        run: python scripts/check-css-separation.py
