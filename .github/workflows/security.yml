name: Portfolio security checks

on:
  push:
    branches: [lab/css-pass]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-security:
    name: Static HTML security policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run static security regression checks
        run: python3 scripts/security_check.py
      - name: Scan repository history for exposed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
